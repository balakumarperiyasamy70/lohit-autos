<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login — Lohit Enterprises</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-body admin-login-body">
<div class="admin-login-card">
    <div class="admin-login-logo">LOHIT ENTERPRISES<span>Dealer Admin</span></div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for category, msg in messages %}<div class="flash flash-{{ category }}">{{ msg }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <form method="post" class="lead-form">
        <input type="text" name="username" placeholder="Username" required autofocus>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Log In</button>
    </form>
</div>
</body>
</html>
