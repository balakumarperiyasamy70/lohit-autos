server {
    listen 80;
    server_name used-cardealer.com www.used-cardealer.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name used-cardealer.com www.used-cardealer.com;

    ssl_certificate /etc/letsencrypt/live/used-cardealer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/used-cardealer.com/privkey.pem;

    client_max_body_size 15M;

    location /static/ {
        alias /opt/lohit-autos/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
